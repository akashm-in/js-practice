<!DOCTYPE html>

</head>
<body>
    <script>
        function capitalize(str){
            a = str[0].toUpperCase();
            b = str.slice(1).toLowerCase();
            return a + b;
        }
        console.log(capitalize("AbcD"))
    </script>
</body>
</html>
